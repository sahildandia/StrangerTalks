project_id = "strangertalk"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[auth]
enabled = true
site_url = "http://localhost:5173"
enable_anonymous_sign_ins = true
[auth.rate_limit]
anonymous_users = 30

# The function validates the bearer token with Auth and checks the admin role.
[functions.admin-users]
verify_jwt = false


name: Set up Supabase backend
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-backend
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$SUPABASE_DB_PASSWORD" && test -n "$SUPABASE_PROJECT_ID" || { echo 'Run scripts/backend-setup.sh first.'; exit 1; }
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase db push --yes
